<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="assets/style.css">
    <style>
        body { background: transparent; }
        .page { max-width: 780px; text-align: center; }

        .social-columns {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 22px;
            margin-top: 12px;
        }
        .social-person {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: var(--radius);
            padding: 30px 24px;
            text-align: center;
            transition: border-color .2s ease, transform .2s ease;
        }
        .social-person:hover {
            border-color: rgba(34,211,238,0.35);
            transform: translateY(-2px);
        }
        .social-avatar {
            width: 60px;
            height: 60px;
            margin: 0 auto 16px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-dim), rgba(255,255,255,0.06));
            border: 1px solid var(--panel-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
        }
        .social-name {
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 20px;
            letter-spacing: .5px;
            margin-bottom: 20px;
        }
        .social-icons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .social-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--panel-border);
            transition: transform .2s cubic-bezier(.34,1.56,.64,1), background .2s ease, box-shadow .2s ease, opacity .2s ease;
        }
        .social-icon svg { width: 19px; height: 19px; fill: var(--text-dim); transition: fill .2s ease; }
        .social-icon:hover svg { fill: #fff; }
        .social-icon:hover { transform: scale(1.14) translateY(-2px); }
        .social-icon.disabled { opacity: .3; pointer-events: none; }

        .social-icon.tiktok:hover { background: #000; box-shadow: 0 0 0 1px #25F4EE, 0 6px 18px rgba(37,244,238,0.35); }
        .social-icon.youtube:hover { background: #FF0000; box-shadow: 0 6px 18px rgba(255,0,0,0.4); }
        .social-icon.discord:hover { background: #5865F2; box-shadow: 0 6px 18px rgba(88,101,242,0.4); }
        .social-icon.spotify:hover { background: #1ED760; box-shadow: 0 6px 18px rgba(30,215,96,0.4); }
        .social-icon.gunslol:hover { background: #8B5CF6; box-shadow: 0 6px 18px rgba(139,92,246,0.4); }

        .empty-hint { color: var(--text-faint); font-size: 13px; margin-top: 40px; }
    </style>
</head>
<body>
    <div class="page">
        <span class="eyebrow">Communauté</span>
        <h1 class="page-title">Nous Suivre</h1>
        <p class="page-subtitle">Retrouve-nous sur nos réseaux et nos playlists</p>

        <div class="social-columns" id="socialColumns">
            <p style="color:var(--text-dim);">Chargement...</p>
        </div>
        <p class="empty-hint" id="emptyHint" style="display:none;">Les liens n'ont pas encore été renseignés par l'administration.</p>
    </div>

    <script>
        const ICONS = {

            discord: '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z"/></svg>',

            gunslol: '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M17 7h-3a1 1 0 100 2h3a3 3 0 010 6h-3a1 1 0 100 2h3a5 5 0 000-10zM7 17h3a1 1 0 100-2H7a3 3 0 010-6h3a1 1 0 100-2H7a5 5 0 000 10zm1-4h8a1 1 0 100-2H8a1 1 0 100 2z"/></svg>'
        };
        const PLATFORM_LABELS = { tiktok: 'TikTok', youtube: 'YouTube', discord: 'Discord', spotify: 'Spotify (playlists)', gunslol: 'guns.lol' };

        function buildIcon(platform, url) {
            const has = !!(url && url.trim());
            const href = has ? url.trim() : '#';
            return `<a class="social-icon ${platform} ${has ? '' : 'disabled'}" href="${href}" target="_blank" title="${PLATFORM_LABELS[platform]}">${ICONS[platform]}</a>`;
        }

        function buildPerson(person) {
            return `
                <div class="social-person">
                    <div class="social-avatar">🧑</div>
                    <div class="social-name">${person.name || 'Membre'}</div>
                    <div class="social-icons">
                        ${['tiktok', 'youtube', 'discord', 'spotify', 'gunslol'].map(p => buildIcon(p, person[p])).join('')}
                    </div>
                </div>
            `;
        }

        window.onload = async function() {
            let links;
            try {
                links = await window.parent.getSocialLinks();
            } catch (e) {
                console.error('getSocialLinks error :', e);
                links = { person1: { name: 'Toi' }, person2: { name: 'Ton ami' } };
            }
            document.getElementById('socialColumns').innerHTML = buildPerson(links.person1) + buildPerson(links.person2);
            const anyLink = [links.person1, links.person2].some(p =>
                ['tiktok', 'youtube', 'discord', 'spotify', 'gunslol'].some(k => p[k] && p[k].trim())
            );
            document.getElementById('emptyHint').style.display = anyLink ? 'none' : 'block';
        };
    </script>
</body>
</html>
